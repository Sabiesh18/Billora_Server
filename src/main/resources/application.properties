# =============================================================================
# Restaurant Billing Application - Configuration Properties
# Designed for 100% Offline Local Operation with PostgreSQL & pgAdmin
# =============================================================================

spring.application.name=RestaurantBillingBackend
server.port=8080

# Database Connection (Standard Localhost PostgreSQL managed via pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/Billora
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings for High Responsiveness in Offline POS
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JWT Security Configuration
app.jwt.secret=9a3b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b
app.jwt.expiration-ms=86400000

# Default Regional & Formatting Preferences (Mirroring ResponseManager.cs)
app.regional.timezone=Asia/Kolkata
app.regional.date-format=dd MMM, yyyy h:mm a

# Logging Settings
logging.level.root=INFO
logging.level.com.restaurant.billing=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
